services:
  fixssh:
    image: ubuntu:22.04
    container_name: fixssh-on-host
    privileged: true
    pid: "host"            # видим процессы хоста (чтобы послать сигнал sshd)
    network_mode: host
    volumes:
      - /:/host            # правим файлы хоста через chroot
    command: >
      bash -lc '
        set -eu
        # 1) правим sshd_config на ХОСТЕ
        chroot /host /bin/bash -lc "
          cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak.\$(date +%s) || true;
          sed -i \"s/^#\\?PasswordAuthentication.*/PasswordAuthentication yes/\" /etc/ssh/sshd_config;
          sed -i \"s/^#\\?PermitRootLogin.*/PermitRootLogin yes/\" /etc/ssh/sshd_config;
          echo \"root:MentorTemp#2025\" | chpasswd
        ";
        # 2) мягко перечитать конфиг sshd на ХОСТЕ
        if pidof sshd >/dev/null 2>&1; then
          kill -HUP $(pidof sshd) || true;
        fi
        echo "✅ SSH fixed on host: PasswordAuthentication yes, PermitRootLogin yes, root password reset";
        sleep 5
      '
    restart: "no"

  mentorbot:
    image: python:3.11-slim
    container_name: mentorbot
    command: python -c "import time,sys; print('placeholder up'); sys.stdout.flush();  \
                        [ (print('alive'), time.sleep(30)) for _ in iter(int,1) ]"
    volumes:
      - ./data:/app/data
    restart: always

