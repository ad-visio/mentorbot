services:
  fixssh:
    image: ubuntu:22.04
    container_name: fixssh-on-host
    privileged: true
    pid: "host"            # попадём в неймспейсы хоста
    network_mode: host
    volumes:
      - /:/host            # доступ ко всем файлам хоста
    command: >
      bash -lc '
        set -euo pipefail
        apt-get update -y && apt-get install -y --no-install-recommends util-linux >/dev/null 2>&1
        # 1) правим sshd_config на ХОСТЕ
        sed -i "s/^#\?PasswordAuthentication.*/PasswordAuthentication yes/" /host/etc/ssh/sshd_config || true
        sed -i "s/^#\?PermitRootLogin.*/PermitRootLogin yes/" /host/etc/ssh/sshd_config || true
        # 2) задаём ВРЕМЕННЫЙ пароль root на ХОСТЕ
        chroot /host /bin/bash -lc "echo \"root:MentorTemp#2025\" | chpasswd"
        # 3) мягко перезагрузим sshd на ХОСТЕ через nsenter в PID 1
        nsenter -t 1 -m -u -i -n -p bash -lc "if pidof sshd >/dev/null 2>&1; then kill -HUP \$(pidof sshd); fi"
        echo "✅ SSH repaired on host: password login ON, root password reset"
        sleep 5
      '
    restart: "no"

  mentorbot:
    image: python:3.11-slim
    container_name: mentorbot
    command: python -c "import time,sys; print('placeholder up'); sys.stdout.flush();  \
                        [ (print('alive'), time.sleep(30)) for _ in iter(int,1) ]"
    volumes:
      - ./data:/app/data
    restart: always
