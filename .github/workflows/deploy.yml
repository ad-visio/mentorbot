name: Deploy to VPS
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write SSH key & known_hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # не полагаемся на known_hosts — будем коннектиться с отключенной проверкой
          echo "OK"

      - name: Test SSH (very verbose)
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o PreferredAuthentications=publickey \
              -o PasswordAuthentication=no \
              -o KexAlgorithms=+curve25519-sha256,+curve25519-sha256@libssh.org \
              -o HostKeyAlgorithms=+ssh-ed25519,+ssh-rsa \
              -o PubkeyAcceptedAlgorithms=+ssh-ed25519,+ssh-rsa \
              -p 22 \
              -vvv ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo RUNNER_CAN_SSH"

      - name: Ensure /opt/mentorbot on VPS
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
              -p 22 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "mkdir -p /opt/mentorbot && chown -R \$USER:\$USER /opt/mentorbot"

      - name: Rsync repo to VPS
        shell: bash
        run: |
          rsync -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=publickey -o PasswordAuthentication=no -p 22" \
                -avz --delete --exclude ".git" . \
                ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/mentorbot/

      - name: Build & up via Docker (skip if no compose)
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o PreferredAuthentications=publickey -o PasswordAuthentication=no \
              -p 22 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "\
                cd /opt/mentorbot && \
                if [ -f docker-compose.yml ]; then \
                  docker compose build && docker compose up -d && docker image prune -f; \
                else \
                  echo 'docker-compose.yml not found yet — skipping'; \
                fi \
              "
