name: Deploy to VPS
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection (verbose)
        run: |
          ssh -o StrictHostKeyChecking=no -vvv ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo RUNNER_CAN_SSH"

      - name: Ensure project dir on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/mentorbot && sudo chown -R \$USER:\$USER /opt/mentorbot"

      - name: Sync files to VPS (rsync over SSH)
        run: |
          rsync -e "ssh -o StrictHostKeyChecking=no" -avz --delete --exclude ".git" . ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/mentorbot/

      - name: Build & up via Docker (skip if no compose yet)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "\
            cd /opt/mentorbot && \
            if [ -f docker-compose.yml ]; then \
              docker compose build && docker compose up -d && docker image prune -f; \
            else \
              echo 'docker-compose.yml not found yet — skipping run step.'; \
            fi \
          "
