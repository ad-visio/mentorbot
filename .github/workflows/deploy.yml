name: Deploy to VPS
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Verify secrets exist (masked)
        run: |
          test -n "${{ secrets.VPS_HOST }}" || (echo "VPS_HOST is empty" && exit 1)
          test -n "${{ secrets.VPS_USER }}" || (echo "VPS_USER is empty" && exit 1)
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "VPS_SSH_KEY is empty" && exit 1)
          echo "Secrets present."

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection (verbose)
        run: |
          ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=publickey -vvv ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo RUNNER_CAN_SSH"

      - name: Rsync test (no delete)
        run: |
          rsync -e "ssh -o StrictHostKeyChecking=no" -avz README.md ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/mentorbot/ || true

      - name: Compose step (skip if absent)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "\
            cd /opt/mentorbot && \
            if [ -f docker-compose.yml ]; then \
              docker compose ps; \
            else \
              echo 'docker-compose.yml not found yet — skipping'; \
            fi \
          "
